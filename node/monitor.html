<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIX Node Control</title>
<style>
:root{--bg:#06070a;--p:rgba(255,255,255,.045);--b:rgba(255,255,255,.09);--t:#e8eaf0;--m:#8b90a0;--ac:#34d399;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#0e2a22 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#14183a 0,transparent 55%),var(--bg);color:var(--t);font:14px/1.45 -apple-system,Inter,system-ui,sans-serif;min-height:100vh}
.mono{font-family:ui-monospace,Menlo,monospace}.wrap{max-width:1100px;margin:0 auto;padding:18px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}h1{font-size:15px;margin:0;letter-spacing:.14em}
.dot{width:10px;height:10px;border-radius:50%;background:var(--m)}.dot.on{background:var(--ac);box-shadow:0 0 12px var(--ac)}.dot.off{background:var(--bad)}
.panel{background:var(--p);border:1px solid var(--b);border-radius:16px;padding:14px;backdrop-filter:blur(14px);margin-bottom:14px}
.panel h2{font-size:11px;letter-spacing:.14em;color:var(--m);margin:0 0 10px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{background:rgba(255,255,255,.03);border:1px solid var(--b);border-radius:12px;padding:10px 12px}.card small{display:block;color:var(--m);font-size:10px;letter-spacing:.1em}.card b{font-size:19px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#60a5fa);width:0;transition:width .6s}
input,select,textarea{background:rgba(0,0,0,.35);border:1px solid var(--b);color:var(--t);border-radius:10px;padding:9px 11px;font:inherit;width:100%}
button{background:var(--t);color:#000;border:0;border-radius:10px;padding:8px 13px;font-weight:600;cursor:pointer;font:inherit;font-weight:600}button.g{background:rgba(255,255,255,.07);color:var(--t);border:1px solid var(--b)}button.d{background:rgba(248,113,113,.14);color:var(--bad);border:1px solid rgba(248,113,113,.3)}
button:disabled{opacity:.4}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--m);font-weight:500;padding:6px 8px;font-size:10px;letter-spacing:.1em}td{padding:7px 8px;border-top:1px solid var(--b)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:140px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.pill{font-size:10px;padding:2px 8px;border-radius:99px;background:rgba(52,211,153,.14);color:var(--ac);border:1px solid rgba(52,211,153,.3)}.err{color:var(--bad);font-size:12px}
#chatout{white-space:pre-wrap;min-height:60px;max-height:260px;overflow:auto;font-size:13px;margin-top:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:rgba(255,255,255,.06);color:var(--t);border:1px solid var(--b);font-size:12px;padding:7px 13px}.tabs button.on{background:var(--t);color:#000}.tab{display:none}.tab.on{display:block}
.bars{display:flex;gap:4px;align-items:flex-end;height:110px}.bars div{flex:1;min-width:8px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}.bars i{display:block;width:100%;background:linear-gradient(180deg,var(--ac),#3b82f6);border-radius:3px 3px 0 0}.bars span{font-size:9px;color:var(--m)}
.pv{max-width:340px;white-space:normal;color:var(--t)}.pv.r{color:var(--m)}.note{font-size:11px;color:var(--m);border:1px solid var(--b);border-radius:10px;padding:8px 10px;margin-bottom:10px}.tag{font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid var(--b);color:var(--m)}.tag.api{color:#60a5fa;border-color:#60a5fa55}.tag.chat{color:var(--ac);border-color:#34d39955}.tag.task{color:var(--warn);border-color:#fbbf2455}
.mini{padding:3px 9px;font-size:11px}
.wrap{max-width:1380px;padding:22px 26px}
body{background:radial-gradient(1100px 620px at 12% -12%,#0f3a2e 0,transparent 60%),radial-gradient(900px 520px at 98% -6%,#1d1f5c 0,transparent 55%),radial-gradient(700px 500px at 50% 110%,#2a0f3d 0,transparent 60%),#05060a;background-attachment:fixed}
header{padding-bottom:14px;border-bottom:1px solid var(--b);position:relative}header:after{content:"";position:absolute;left:0;bottom:-1px;width:160px;height:2px;background:linear-gradient(90deg,var(--ac),#60a5fa,transparent)}
h1{font-size:16px;letter-spacing:.2em;background:linear-gradient(90deg,#fff,#7dd3fc 60%,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{position:sticky;top:0;z-index:20;padding:10px 0;background:linear-gradient(#05060acc,#05060a00);backdrop-filter:blur(10px);margin-bottom:10px}
.tabs button{border-radius:99px;padding:8px 16px;transition:all .18s}.tabs button:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}.tabs button.on{background:linear-gradient(135deg,#34d399,#60a5fa);color:#02110c;border-color:transparent;box-shadow:0 6px 22px -6px #34d399aa}
.panel{background:linear-gradient(160deg,rgba(255,255,255,.065),rgba(255,255,255,.02));border-radius:18px;box-shadow:0 10px 40px -18px #000;transition:border-color .2s}.panel:hover{border-color:rgba(255,255,255,.17)}
.tab.on{animation:fadeIn .35s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border-radius:14px;padding:12px 14px}.card:before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:linear-gradient(90deg,var(--c1,#34d399),var(--c2,#60a5fa))}
.card b{font-size:24px;letter-spacing:-.02em;font-weight:700}.card .sp{position:absolute;right:8px;bottom:6px;opacity:.9}.card .dl{font-size:11px;margin-left:6px;font-weight:600}.dl.up{color:var(--ac)}.dl.dn{color:var(--bad)}
.cards.k{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
table tr:hover td{background:rgba(255,255,255,.03)}th{border-bottom:1px solid var(--b)}td{border-top:1px solid rgba(255,255,255,.05)}
.ch{width:100%;height:auto;display:block}.ch text{fill:#8b90a0;font:9px ui-monospace,Menlo,monospace}.ch .gl{stroke:rgba(255,255,255,.07)}.ch .hv{fill:transparent}.ch .hv:hover{fill:rgba(255,255,255,.07)}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--m);margin-top:6px}.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font-size:9px;color:var(--m)}.heat div{aspect-ratio:1;border-radius:3px;min-height:12px}.heat .l{aspect-ratio:auto;display:flex;align-items:center;font-size:10px}.heat .hh{aspect-ratio:auto;text-align:center;min-height:0}
.donutw{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.donutw table{flex:1;min-width:180px}
.hb{display:grid;grid-template-columns:minmax(80px,170px) 1fr 70px;gap:8px;align-items:center;font-size:12px;margin:5px 0}.hb .t{height:9px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}.hb .t i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--c1,#34d399),var(--c2,#60a5fa))}.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb span:last-child{text-align:right;color:var(--m)}
.gauges{display:flex;gap:18px;flex-wrap:wrap;justify-content:space-around}.gauge{text-align:center;font-size:11px;color:var(--m)}.gauge b{display:block;color:var(--t);font-size:18px}
.sect{font-size:11px;letter-spacing:.2em;color:var(--m);margin:20px 2px 10px;display:flex;align-items:center;gap:10px}.sect:after{content:"";flex:1;height:1px;background:var(--b)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:1000px){.grid3{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<header><span class="dot" id="dot"></span><h1 class="mono">AIX NODE CONTROL</h1><span class="mono" id="host" style="color:var(--m);font-size:12px"></span><span style="flex:1"></span><button class="g" id="disc">Disconnect</button></header>
<div class="panel" id="conn" style="max-width:520px;margin:40px auto"><h2 class="mono">CONNECT TO YOUR NODE</h2><div class="row" style="flex-direction:column;align-items:stretch;gap:8px"><input id="url" placeholder="Node URL, e.g. http://localhost:8787"><input id="tok" type="password" placeholder="Token (the contents of .aix-token)"><button id="go">Connect</button><div class="err" id="cerr"></div><div style="color:var(--m);font-size:12px">Tip: open this page from your node (http://localhost:8787) and only the token is needed.</div></div></div>
<div id="main" style="display:none">
<div class="tabs" id="tabs"><button data-t="over" class="on">Overview</button><button data-t="media">Media (image + video)</button><button data-t="analytics">Analytics</button><button data-t="live">Live requests</button><button data-t="api">API</button><button data-t="users">Users</button><button data-t="tasks">Tasks</button><button data-t="money">Money</button><button data-t="safety">Safety</button><button data-t="referrals">Referrals</button><button data-t="promos">Promo videos</button><button data-t="storage">Storage</button><button data-t="health">Health</button><button data-t="backups">Backups</button><button data-t="finance">Finance</button><button data-t="user360">User 360</button><button data-t="radar">Fraud radar</button><button data-t="support">Support <span id="supbadge"></span></button><button data-t="alerts">Alerts <span id="albadge"></span></button><button data-t="ops">Ops</button><button data-t="growth">Growth</button><button data-t="money2">Money+</button><button data-t="controls">Controls</button><button data-t="sec">Security</button><button data-t="audit">Audit log</button><button data-t="settings">Settings</button><button data-t="node">Node &amp; models</button><span style="flex:1"></span><span class="mono" id="upd" style="font-size:11px;color:var(--m);align-self:center"></span></div>
<div class="tab" id="t-analytics"><div id="analyticsv"></div></div>
<div class="tab on" id="t-over"><div id="ov"></div></div>
<div class="tab" id="t-media"><div id="mediav"></div></div>
<div class="tab" id="t-live"><div class="note" id="livenote"></div><div class="row" style="margin-bottom:8px"><select id="lsrc" style="width:auto"><option value="">All sources</option><option value="chat">Chat (apps)</option><option value="api">API</option><option value="task">Scheduled tasks</option><option value="direct">Direct</option></select><input id="lq" class="grow" placeholder="Search prompts, replies, users…"></div><div class="panel" style="overflow:auto"><div id="live"></div></div></div>
<div class="tab" id="t-api"><div id="apiv"></div></div>
<div class="tab" id="t-users"><div class="row" style="margin-bottom:8px"><input id="uq" class="grow" placeholder="Search users…"></div><div class="panel" style="overflow:auto"><div id="usersv"></div></div></div>
<div class="tab" id="t-tasks"><div id="tasksv"></div></div>
<div class="tab" id="t-ops"></div><div class="tab" id="t-growth"></div><div class="tab" id="t-money2"></div><div class="tab" id="t-controls"></div><div class="tab" id="t-sec"></div>
<div class="tab" id="t-money"><div id="moneyv"></div></div>
<div class="tab" id="t-safety"><div id="safetyv"></div></div>
<div class="tab" id="t-referrals"><div id="referralsv"></div></div>
<div class="tab" id="t-promos"><div id="promosv"></div></div>
<div class="tab" id="t-storage"><div id="storagev"></div></div>
<div class="tab" id="t-health"><div id="healthv"></div></div>
<div class="tab" id="t-backups"><div id="backupsv"></div></div><div class="tab" id="t-finance"><div id="financev"></div></div><div class="tab" id="t-user360"><div id="user360v"></div></div><div class="tab" id="t-radar"><div id="radarv"></div></div><div class="tab" id="t-support"><div id="supportv"></div></div><div class="tab" id="t-alerts"><div id="alertsv"></div></div><div class="tab" id="t-audit"><div id="auditv"></div></div><div class="tab" id="t-settings"><div id="settingsv"></div></div>
<div class="tab" id="t-node">
<div class="cards" id="cards"></div><div style="height:14px"></div>
<div class="grid2">
 <div class="panel"><h2 class="mono">LOADED IN MEMORY</h2><div id="loaded"></div><h2 class="mono" style="margin-top:14px">MACHINE</h2><div id="mach"></div></div>
 <div class="panel"><h2 class="mono">TRY THE MODEL</h2><div class="row"><select id="cm" class="grow"></select></div><div class="row" style="margin-top:8px"><input id="cp" class="grow" placeholder="Say something…" value="Write a haiku about Mac Studios."><button id="cs">Send</button></div><div id="chatout" class="mono"></div></div>
</div>
<div class="panel"><h2 class="mono">MODEL TIERS &amp; SETTINGS</h2><div id="tiers" class="mono" style="font-size:12px">Loading...</div><div class="row" style="margin:10px 0 4px;flex-wrap:wrap;gap:6px"><span class="mono" style="opacity:.7;width:100%">Recommended (Qwen 3.x) - click to download:</span><button class="rec" data-m="qwen4:27b">qwen4:27b (XQ, when released)</button><button class="rec" data-m="qwen3.8:27b">qwen3.8:27b</button><button class="rec" data-m="qwen3.6:35b-a3b">qwen3.6:35b-a3b</button><button class="rec" data-m="qwen3-coder:30b">qwen3-coder:30b</button><button class="rec" data-m="qwen3.5:9b">qwen3.5:9b</button><button class="rec" data-m="qwen3.5:4b">qwen3.5:4b</button><button class="rec" data-m="qwen3-vl:8b">qwen3-vl:8b</button></div></div>
<div class="panel"><h2 class="mono">MODELS</h2><div class="row" style="margin-bottom:10px"><input id="pn" class="grow" placeholder="Model to download, e.g. qwen3.8:27b or llama3.3:70b"><button id="pb">Download</button></div><div id="pg"></div><div id="models" style="overflow:auto"></div></div>
<div class="panel"><h2 class="mono">RECENT REQUESTS</h2><div id="log" style="overflow:auto"></div></div>
</div></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch{}return''};
(function(){try{const h=new URLSearchParams(location.hash.slice(1));if(h.get('token')){localStorage.setItem('aixnode_tok',h.get('token'));localStorage.setItem('aixnode_url',location.origin);history.replaceState(null,'',location.pathname)}}catch(e){}})();
let URL0=LS('aixnode_url')||(location.protocol.startsWith('http')&&location.hostname?location.origin:''),TOK=LS('aixnode_tok'),timer=0;
$('#url').value=URL0;const gb=n=>(n/1073741824).toFixed(1)+' GB',dur=s=>s>86400?Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h':s>3600?Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m':Math.floor(s/60)+'m '+s%60+'s';
async function api(p,o={}){const r=await fetch(URL0.replace(/\/+$/,'')+p,{...o,headers:{'content-type':'application/json',authorization:'Bearer '+TOK,...(o.headers||{})}});if(r.status===401){const j=await r.clone().json().catch(()=>({}));if(j.need2fa&&!o.__retry&&window.do2fa){await window.do2fa();return api(p,{...o,__retry:1})}throw new Error('Wrong token')}if(!r.ok&&!o.raw)throw new Error('HTTP '+r.status);return o.raw?r:r.json()}
async function connect(){URL0=$('#url').value.trim();TOK=$('#tok').value.trim()||TOK;$('#cerr').textContent='';try{await api('/admin/status');LS('aixnode_url',URL0);LS('aixnode_tok',TOK);$('#conn').style.display='none';$('#main').style.display='';roleGate();tick();timer=setInterval(tick,2000);models()}catch(e){$('#cerr').textContent=e.message.includes('Failed')?'Cannot reach the node. Is the launcher window still open?':e.message}}
$('#go').onclick=connect;$('#tok').onkeydown=e=>{if(e.key==='Enter')connect()};if(URL0&&TOK)connect();else if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){$('#url').value=location.origin;TOK='-';connect()}
$('#disc').onclick=()=>{clearInterval(timer);LS('aixnode_tok','');TOK='';$('#main').style.display='none';$('#conn').style.display='';$('#dot').className='dot'};
async function tick(){try{const s=await api('/admin/status');$('#dot').className='dot '+(s.ollama?'on':'off');$('#host').textContent=s.host+' · Ollama '+(s.version||'?');
const used=s.mem.total-s.mem.free,pct=Math.round(100*used/s.mem.total);
$('#cards').innerHTML=[['STATUS',s.ollama?'<span style="color:var(--ac)">ONLINE</span>':'<span style="color:var(--bad)">OLLAMA DOWN</span>'],['CPU',s.cpu+'%<div class="bar"><i style="width:'+s.cpu+'%"></i></div>'],['MEMORY',pct+'%<div class="bar"><i style="width:'+pct+'%"></i></div>'],['REQUESTS',s.req+' <small style="display:inline">('+s.err+' err)</small>'],['≈ TOKENS OUT',s.tokens.toLocaleString()],['AVG REPLY',(s.avgMs/1000).toFixed(1)+'s'],['NODE UPTIME',dur(s.uptime)]].map(([a,b])=>`<div class="card"><small class="mono">${a}</small><b>${b}</b></div>`).join('');
$('#loaded').innerHTML=s.loaded.length?s.loaded.map(m=>`<div class="row" style="margin-bottom:6px"><b class="grow mono" style="font-size:12px">${E(m.name)}</b><span class="pill">${gb(m.size)}</span><button class="g" data-un="${E(m.name)}">Unload</button></div>`).join(''):'<span style="color:var(--m)">Nothing loaded. The model loads on the first request and unloads after 30 min idle.</span>';
$('#mach').innerHTML=`<div class="mono" style="font-size:12px;color:var(--m)">${E(s.chip||'')} · ${s.cores} cores<br>RAM ${gb(used)} used of ${gb(s.mem.total)} (macOS counts cache as used)<br>Load ${s.load.map(x=>x.toFixed(2)).join(' / ')} · Mac up ${dur(s.sysUptime)}</div>`;
const l=(await api('/admin/log')).items;$('#log').innerHTML='<table class="mono"><tr><th>TIME</th><th>MODEL</th><th>STATUS</th><th>TIME</th><th>≈TOK</th></tr>'+(l.map(e=>`<tr><td>${new Date(e.t).toLocaleTimeString()}</td><td>${E(e.model)}</td><td style="color:${e.status<400?'var(--ac)':'var(--bad)'}">${e.status}</td><td>${(e.ms/1000).toFixed(1)}s</td><td>${e.tokens}</td></tr>`).join('')||'<tr><td colspan=5 style="color:var(--m)">No requests yet</td></tr>')+'</table>'}catch(e){$('#dot').className='dot off';$('#host').textContent='Node unreachable'}}
document.addEventListener('click',async e=>{const t=e.target;if(t.dataset.un){await api('/admin/unload',{method:'POST',body:JSON.stringify({name:t.dataset.un})});tick()}
if(t.dataset.del){if(!confirm('Delete model '+t.dataset.del+'?'))return;await api('/admin/delete',{method:'POST',body:JSON.stringify({name:t.dataset.del})});models()}});
async function models(){try{const m=(await api('/admin/models')).models||[];$('#cm').innerHTML=m.map(x=>`<option>${E(x.name)}</option>`).join('');const dm=(LS('aixnode_model'));if(dm)$('#cm').value=dm;
$('#models').innerHTML='<table class="mono"><tr><th>MODEL</th><th>SIZE</th><th>PARAMS</th><th>MODIFIED</th><th></th></tr>'+(m.map(x=>`<tr><td>${E(x.name)}</td><td>${gb(x.size)}</td><td>${E((x.details||{}).parameter_size||'')}</td><td>${E((x.modified_at||'').slice(0,10))}</td><td><button class="d" data-del="${E(x.name)}">Delete</button></td></tr>`).join('')||'<tr><td colspan=5 style="color:var(--m)">No models yet</td></tr>')+'</table>'}catch(e){}}
$('#cm').onchange=()=>LS('aixnode_model',$('#cm').value);
$('#pb').onclick=async()=>{const n=$('#pn').value.trim();if(!n)return;$('#pb').disabled=true;const pg=$('#pg');try{const r=await api('/admin/pull',{method:'POST',body:JSON.stringify({name:n}),raw:true});const rd=r.body.getReader(),dc=new TextDecoder();let buf='';for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();for(const l of ls){if(!l.trim())continue;const j=JSON.parse(l);const p=j.total?Math.round(100*(j.completed||0)/j.total):0;pg.innerHTML=`<div class="mono" style="font-size:12px;margin-bottom:8px">${E(j.error||j.status)} ${p?p+'%':''}<div class="bar"><i style="width:${p}%"></i></div></div>`}}pg.innerHTML='<div class="mono" style="color:var(--ac);font-size:12px;margin-bottom:8px">Done</div>';models()}catch(e){pg.innerHTML='<div class="err">'+E(e.message)+'</div>'}$('#pb').disabled=false};
$('#cs').onclick=async()=>{const out=$('#chatout');out.textContent='…';$('#cs').disabled=true;try{const r=await api('/v1/chat/completions',{method:'POST',body:JSON.stringify({model:$('#cm').value,stream:true,messages:[{role:'user',content:$('#cp').value}]}),raw:true});const rd=r.body.getReader(),dc=new TextDecoder();let buf='',txt='';for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();for(const l of ls){if(!l.startsWith('data:')||l.includes('[DONE]'))continue;try{txt+=(JSON.parse(l.slice(5)).choices[0].delta.content||'');out.textContent=txt}catch{}}}if(!txt)out.textContent='(empty reply)'}catch(e){out.textContent=e.message}$('#cs').disabled=false};

/* ===== cloud + live monitoring tabs ===== */

  sectionRunner('s_2fa','ADMIN SIGN-IN SECURITY',async()=>{const j=await api('/admin/sessions').catch(()=>({sessions:[],enabled:false}));return {html:`<div class="row"><span class="pill" style="${j.enabled?'':'opacity:.6'}">Two-step code: ${j.enabled?'ON':'off'}</span>${j.enabled?'<button id="t_off" class="mini">Turn off</button>':'<button id="t_on" class="mini">Turn on</button>'}</div><div class="note">With two-step on, signing in to this panel from anywhere except this Mac needs a 6-digit code from an authenticator app (Google Authenticator, 1Password…). Sessions last 12 hours.</div><div class="sect">SIGNED-IN SESSIONS</div>`+tbl(['Started','From','Device','Expires',''],j.sessions.map(s=>[when(s.at),E(s.ip||''),E(s.ua||''),when(s.exp),s.current?'this one':`<button class="mini" data-r="${s.id}">Sign out</button>`]),'No code-based sessions right now.')+(j.sessions.length?'<div class="row" style="margin-top:8px"><button id="s_all" class="mini">Sign out all</button></div>':''),after:el=>{const on=el.querySelector('#t_on'),off=el.querySelector('#t_off');if(on)on.onclick=async()=>{const s=await api('/admin/2fa/setup');const m=modal(`<h2>TURN ON TWO-STEP</h2><p style="font-size:13px">In your authenticator app choose “Enter a setup key” and type:</p><p class="mono" style="font-size:16px;letter-spacing:.1em;user-select:all">${E(s.secret)}</p><p style="font-size:12px;color:var(--m)">Account name: AIX Alpha Admin · Time-based. Then enter the 6-digit code it shows:</p><div class="row"><input id="tc" placeholder="123456" style="width:140px"><button id="tg">Confirm</button></div>`);m.querySelector('#tg').onclick=async()=>{try{const r=await api('/admin/2fa/confirm',{method:'POST',body:JSON.stringify({code:m.querySelector('#tc').value})});toastX(r.note||'On');m.remove();loadSec()}catch(e){toastX('That code did not match',1)}}};if(off)off.onclick=async()=>{const c=prompt('Enter a current code to turn it off');if(!c)return;try{await api('/admin/2fa/disable',{method:'POST',body:JSON.stringify({code:c})});loadSec()}catch{toastX('Wrong code',1)}};el.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{await api('/admin/sessions',{method:'POST',body:JSON.stringify({id:b.dataset.r})});loadSec()});const al=el.querySelector('#s_all');if(al)al.onclick=async()=>{await api('/admin/sessions',{method:'POST',body:JSON.stringify({all:true})});toastX('Everyone signed out');loadSec()}}}});
  sectionRunner('s_log','SUSPICIOUS LOGINS',async()=>{const j=await G('logins');return {html:(j.flagged.length?j.flagged.map(f=>`<div class="note" style="border-color:var(--warn);color:var(--t)">⚠ ${E(f.why)} ${f.ip?`<button class="mini" data-b="${E(f.ip)}" style="margin-left:8px">Block IP 24h</button>`:''}</div>`).join(''):'<div class="note">Nothing suspicious in the last 24 hours.</div>')+`<div class="sect">RECENT SIGN-IN ATTEMPTS</div>`+tbl(['When','Account','IP','Result'],j.recent.slice(0,40).map(r=>[when(r.at),E(r.who),E(r.ip),r.ok?'ok':'<span class="err">failed</span>']),'No sign-in attempts recorded yet.'),after:el=>el.querySelectorAll('[data-b]').forEach(b=>b.onclick=async()=>{await POSTX('block_add',{kind:'ip',value:b.dataset.b,hours:24,reason:'suspicious sign-ins'});toastX('Blocked for 24 hours')})}});
  sectionRunner('s_exp','EXPORT EVERYTHING & RESTORE TEST',async()=>({html:`<div class="row"><button id="ex_go">Download everything (JSON)</button><button id="rt_go">Test the latest backup</button></div><div id="rt_out" style="margin-top:10px"></div><div class="note">The export holds users, purchases, credits, refunds, codes, tickets and settings. Passwords and sign-in tokens are left out. The restore test opens your newest backup and checks it is complete, without changing anything.</div>`,after:el=>{el.querySelector('#ex_go').onclick=async()=>{try{const r=await G('export_all');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.json],{type:'application/json'}));a.download=r.name;a.click();toastX('Exported '+Object.values(r.counts).reduce((x,y)=>x+y,0)+' rows')}catch(e){toastX(e.message,1)}};el.querySelector('#rt_go').onclick=async()=>{const o=el.querySelector('#rt_out');o.innerHTML='<div class="note">Checking…</div>';try{const r=await POSTX('restore_test',null).catch(()=>null)||await G('restore_test');o.innerHTML=`<div class="note" style="border-color:${r.ok?'var(--ac)':'var(--warn)'};color:var(--t)">${r.ok?'✓ Backup looks healthy':'⚠ Problems found'}${r.backupAt?' · taken '+when(r.backupAt)+' ('+r.ageHours+' h ago)':''}</div>`+(r.tables?tbl(['Table','In backup','Now'],r.tables.map(t=>[E(t.name),t.backup,t.live==null?'—':t.live])):'')+(r.problems&&r.problems.length?'<ul>'+r.problems.map(p=>'<li>'+E(p)+'</li>').join('')+'</ul>':'')+(r.creditsInBackup!=null?`<div class="note">Credits held: ${r.creditsInBackup} in backup vs ${r.creditsNow} now.</div>`:'')}catch(e){o.innerHTML='<div class="note err">'+E(e.message)+'</div>'}}}}));
};

/* 2-step sign-in: ask for the code when the node requires it */
let P2=null;
window.do2fa=function(){if(P2)return P2;P2=(async()=>{const c=prompt('Enter the 6-digit code from your authenticator app');if(!c)throw new Error('Code needed');const r=await fetch(URL0.replace(/\/+$/,'')+'/admin/2fa/login',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+TOK},body:JSON.stringify({code:c})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Wrong code');TOK=j.session;LS('aixnode_tok',TOK);return true})().finally(()=>setTimeout(()=>{P2=null},500));return P2};
})();


async function loadTiers(){try{const j=await api('/admin/tiers');const names=((await api('/admin/models')).models||[]).map(x=>x.name);const opt=(v)=>'<option value="">(none)</option>'+names.map(n=>`<option ${n===v?'selected':''}>${E(n)}</option>`).join('')+(v&&!names.includes(v)?`<option selected>${E(v)}</option>`:'');
const row=(k,l)=>`<div class="row" style="margin:4px 0"><span style="width:90px">${l}</span><select id="t_${k}" class="grow">${opt(j.tiers[k])}</select></div>`;
$('#tiers').innerHTML=row('eco','Eco')+row('balanced','Balanced')+row('thorough','Thorough')+row('vision','Vision').replace('opt','')+`<div class="row" style="margin:8px 0"><label><input type="checkbox" id="t_think" ${j.think?'checked':''}> Thinking mode (slower, deeper answers on Qwen3)</label></div><button id="t_save">Save tiers</button> <span id="t_msg" style="opacity:.7"></span>`;
$('#t_vision').innerHTML=opt(j.vision);
$('#t_save').onclick=async()=>{const b={eco:$('#t_eco').value,balanced:$('#t_balanced').value,thorough:$('#t_thorough').value,vision:$('#t_vision').value,think:$('#t_think').checked};await api('/admin/tiers',{method:'POST',body:JSON.stringify(b)});$('#t_msg').textContent='Saved - cloud updates within seconds';setTimeout(()=>{$('#t_msg').textContent=''},4000)};
document.querySelectorAll('.rec').forEach(b=>b.onclick=()=>{$('#pn').value=b.dataset.m;$('#pb').click()})}catch(e){$('#tiers').textContent='Could not load tiers: '+e.message}}
loadTiers();setInterval(loadTiers,60000);
</script></body></html>
