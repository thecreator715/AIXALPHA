    <meta property="og:title" content="AIX Alpha v3.0 AI Suite" />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      window.global = window;
      window.process = window.process || { env: {} };
      window.addEventListener('error', function(e) {
        fetch('/api/log-client-error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: e.message,
            filename: e.filename,
            lineno: e.lineno,
            colno: e.colno,
            stack: e.error ? e.error.stack : null
          })
        }).catch(function(){});
      });
      window.addEventListener('unhandledrejection', function(e) {
        fetch('/api/log-client-error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: 'Unhandled Promise: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)),
            stack: e.reason && e.reason.stack ? e.reason.stack : null
          })
        }).catch(function(){});
      });
    </script>
  </head>
  <body style="background-color: #000000; color: #f4f4f5; margin: 0; min-height: 100vh;">
