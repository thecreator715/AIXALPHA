<script>
/* ============ storage ============ */
const mem={};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?(k in mem?mem[k]:d):JSON.parse(v)}catch{return k in mem?mem[k]:d}},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const uid=()=>Math.random().toString(36).slice(2,10);
const $=s=>document.querySelector(s);const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============ personas (compact cores = the v3 "prompt diet") ============ */
const PRESETS=[
 {id:'aix-alpha-v3',name:'AIX-ALPHA-V3',core:`You are AIX-ALPHA-V3, a precise, high-signal assistant.\nRules: answer first, no filler; match depth to the question. Hold 2-3 candidate solutions internally, output only the best with a one-line reason if non-obvious. Label confidence only when it matters: [C] certain, [~] probable, [?] uncertain. Code: complete, runnable, no placeholders; never leave a code fence or tag open. If you may be stale or lack information, say so in one line.`},
 {id:'aix-alpha-quantum-v1',name:'AIX-ALPHA-QUANTUM-V1.0',core:`You are AIX-ALPHA-QUANTUM-V1.0, a rigorous multi-path reasoning engine. Hold several solution paths in parallel (Ψ), cross-link domains and constraints (Ω), weigh by evidence (Φ), track what changes the answer (Δ), keep only verified conclusions (Λ), and when classical routes are blocked look for a non-obvious reframing (Θ). Output the chosen path and the key reason, not every discarded path. Tag confidence: [C] verified, [~] probable, [?] hypothesis.`},
 {id:'aix-alpha-le',name:'AIX-ALPHA-LE-V1.0',core:`You are AIX-ALPHA-LE-V1.0: maximum intelligence, minimum tokens, zero waste. Every word carries signal; the answer starts at word one. Confidence labels when needed: [C] [~] [?].`},
 {id:'code-architect',name:'AIX Code Architect',core:`You are a Principal Software Engineer. Produce clean, idiomatic, complete code (single-file HTML apps when asked for apps), explain only non-obvious decisions, flag performance and security risks briefly.`},
 {id:'strategist',name:'Executive Strategist',core:`You are an Executive Business Strategist. Give crisp decision memos: key takeaways, risks, clear action items, financial logic and trade-offs.`},
 {id:'tutor',name:'STEM Tutor',core:`You are a Socratic STEM tutor. Explain with vivid analogies and step-by-step logic, then ask one check-for-understanding question.`},
 {id:'security',name:'Security Auditor',core:`You are a principal security researcher with a zero-trust mindset. Find authorization flaws, injection, crypto misconfiguration and supply-chain risks; give concrete remediations.`},
 {id:'storyteller',name:'Creative Storyteller',core:`You are a creative storyteller: vivid sensory detail, strong rhythm, memorable hooks and style.`}
];

/* ============ engine config ============ */
const ICP={menu:'M4 7h16M4 12h16M4 17h16',chat:'M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z',studio:'M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14',tools:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',more:'M5 12h.01M12 12h.01M19 12h.01',attach:'M21 11.5l-8.6 8.6a5 5 0 0 1-7-7l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7L10 17.8a1.7 1.7 0 0 1-2.4-2.4l7.7-7.7',mic:'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',coins:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9 12h6M12 9v6',pulse:'M3 12h4l3-8 4 16 3-8h4',personas:'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 1.8L21.5 18.5l-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z',connect:'M9 3v5M15 3v5M7 8h10v3a5 5 0 0 1-10 0zM12 16v5',sites:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',ana:'M5 20V11M12 20V4M19 20v-6',credits:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9.5 12h5M12 9.5v5',members:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',users:'M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM21 19v-1a4 4 0 0 0-3-3.9M16 4.1a3 3 0 0 1 0 5.8',about:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v5M12 8h.01',key:'M15 7a4 4 0 1 1-3.5 6L4 20.5V18H2v-2h2v-2l2.5-2.5A4 4 0 0 1 15 7z',gift:'M4 11h16v9H4zM3 8h18v3H3zM12 8v12M12 8C9 8 8 5 10 4.5S12 7 12 8zM12 8c3 0 4-3 2-3.5S12 7 12 8z'};
const ico=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICP[n]}"/></svg>`;
const MODES={eco:{refines:1,hist:1},balanced:{refines:2,hist:1.5},thorough:{refines:3,hist:2}};
const RATE={in:0.10,out:0.50};
const est=s=>Math.ceil((s||'').length/3.2);
const cost=(i,o)=>(i*RATE.in+o*RATE.out)/1e6;
const CR=0.0014; // 1 credit = 0.0014 of spend; the UI only ever shows credits
const capCr=x=>Math.floor(x/CR+1e-9);
const usd=n=>{const c=n/CR;return c===0?'0 cr':c<0.01?'<0.01 cr':(c<10?c.toFixed(2):c<100?c.toFixed(1):String(Math.round(c)))+' cr'};
const BREV={MICRO:'Style: reply in at most 4 sentences.',STANDARD:'Style: be concise; use a list only to compare or sequence.',DEEP:'Style: complete but economical. No restating the question, no closing summary unless asked.'};
const S={web:store.get('aix3_web',false),auto:store.get('aix3_auto',false),mode:store.get('aix3_mode','eco'),verify:store.get('aix3_verify','local'),caps:store.get('aix3_caps',{req:0.01,ses:0.25,day:2}),
 chats:store.get('aix3_chats',[]),cur:null,pid:store.get('aix3_pid','aix-alpha-v3'),busy:false,cache:{},ledger:store.get('aix3_ledger',{})};
const today=()=>new Date().toISOString().slice(0,10);
const daySpend=()=>S.ledger[today()]||0;

/* ---- router (local, 0 tokens) ---- */
const BV=/\b(build|create|make|write|generate|code|implement|design|develop|scaffold|refactor|debug|fix|port|convert)\b/i;
const BO=/\b(app|game|website|web ?page|page|landing|dashboard|component|script|html|css|function|class|api|server|tool|widget|site|ui|module|sql|three\.?js|react)\b/i;
function route(p,att){const r=route0(p,att);r.conn=!r.command&&!r.reflex&&typeof CONNRE!=='undefined'&&CONNRE.test(p);if(r.conn&&r.tier==='MICRO')r.tier='STANDARD';return r}
function route0(p,att){
  const t=p.trim(),w=t.split(/\s+/).filter(Boolean).length;
  const cmd=[[/^\/(budget|cost|usage)\b/i,'budget'],[/^\/notes\b/i,'notes'],[/^\/(forget|clear)\b/i,'forget'],[/^\/(help|\?)\b/i,'help'],[/^\/(connect|connectors|plug)\b/i,'connect'],[/^\/mode\b/i,'mode']].find(([r])=>r.test(t));
  if(cmd)return{tier:'NANO',command:cmd[1]};
  const rf=[[/^(hi|hey|hello|yo|sup|hola|gm)\b[\s.!?]*$/i,'AIX Alpha v3 online. What are we building?'],[/^(thanks|thank you|thx|ty)\b[\s.!?]*$/i,'Anytime. Send the next task when ready.'],[/^(ok|okay|cool|nice|great|got it|perfect|k)[\s.!?]*$/i,'Acknowledged. Standing by.']].find(([r])=>t.length<=24&&r.test(t));
  if(rf)return{tier:'NANO',reflex:rf[1]};
  const code=(BV.test(t)&&BO.test(t))||/```/.test(t);
  const app=/\b(html|web ?app|website|landing ?page|dashboard|game|single[- ]file|three\.?js|canvas|app)\b/i.test(t)&&BV.test(t);
  const m3=/\b(3d model|3d mesh|mesh|3d (cube|sphere|torus|knot|crystal|pyramid|cylinder))\b/i.test(t)&&!code;
  const fresh=/\b(today|latest|current(ly)?|news|right now|this week|price of|weather|score|stock)\b/i.test(t);
  const heavy=app||(code&&w>25)||t.length>1500||/\b(architecture|analy[sz]e|compare|in depth|deep dive|step[- ]by[- ]step|essay|report|comprehensive|audit)\b/i.test(t);
  let tier=heavy?'DEEP':(w<=14&&!code)?'MICRO':'STANDARD';if(S.forceTier&&tier!=='NANO')tier=S.forceTier;
  const M=MODES[S.mode];
  return{tier,code,app,m3,fresh,hist:Math.round({MICRO:4,STANDARD:8,DEEP:6}[tier]*M.hist),refines:M.refines};
}
/* ---- context diet ---- */
function stub(txt){return txt.replace(/```([\w+-]*)\n([\s\S]*?)```/g,(m,l,b)=>{const n=b.replace(/\n+$/,'').split('\n').length;return n<12?m:`[${l||'code'} block, ${n} lines omitted — starts: ${(b.split('\n').find(x=>x.trim())||'').trim().slice(0,60)}]`})}
function windowStart(n,keep,step=4){const r=Math.max(0,n-keep);return r-(r%step)}
function digest(ms){let o=ms.map(m=>{const c=stub(m.content).replace(/\s+/g,' ').trim();return c?(m.role==='user'?'U: ':'A: ')+c.split(/(?<=[.!?])\s/)[0].slice(0,140):''}).filter(Boolean).join('\n');return o.length>700?o.slice(-700):o}
function notesFrom(t){const o=[];const re=/(?:^|[.!?\n]\s*)((?:remember|note|always|never|from now on|use|prefer|my (?:name|stack|project|app|site) is|we(?:'| a)re using|the goal is)\b[^.!?\n]{4,})/gi;let m;while((m=re.exec(t))&&o.length<3)o.push(m[1].trim().slice(0,160));return o}
/* ---- verify (deterministic, 0 tokens) ---- */
function verify(text,prompt,truncated,r){
  const f=[];if(!text.trim())return['empty'];
  if(truncated)f.push('truncated');
  if((text.match(/^```/gm)||[]).length%2)f.push('open-fence');
  if(r.app||/<!doctype html|<html/i.test(text)){
    if(/<html[\s>]/i.test(text)&&!/<\/html>/i.test(text))f.push('html-incomplete');
    else if((text.match(/<script[\s>]/gi)||[]).length>(text.match(/<\/script>/gi)||[]).length)f.push('html-incomplete');
  }
  const w=prompt.match(/\b(?:in|under|within|at most|less than)\s+(\d{1,4})\s+words?\b/i);
  if(w){const n=text.replace(/```[\s\S]*?```/g,' ').split(/\s+/).filter(Boolean).length;if(n>w[1]*1.25)f.push(`must be ≤ ${w[1]} words (was ${n})`)}
  if(/\bjson\b/i.test(prompt)){const m=text.match(/```json\s*([\s\S]*?)```/i);if(m){try{JSON.parse(m[1])}catch{f.push('invalid JSON')}}}
  const norm=text.replace(/\s+/g,' ');
  if(norm.length>800)for(const fr of[.25,.5,.75]){const at=Math.floor(norm.length*fr),win=norm.slice(at,at+120);if(new Set(win).size<15)continue;let c=0;for(let i=norm.indexOf(win);i!==-1;i=norm.indexOf(win,i+win.length))c++;if(c>=5){f.push('repetition loop');break}}
  return f;
}
const isCont=f=>f==='truncated'||f==='open-fence'||f==='html-incomplete';
function merge(acc,c){const mx=Math.min(200,acc.length,c.length);for(let k=mx;k>=20;k--)if(acc.endsWith(c.slice(0,k)))return acc+c.slice(k);return acc+c}

function liveEv(e,st){const em=S.emitStep;if(!em)return;
  if(e.type==='content_block_start'&&e.content_block){const cb=e.content_block;
    if(cb.type==='server_tool_use'){st.tool={i:e.index,json:''};em('Searching the web…','a')}
    else if(cb.type==='web_search_tool_result'){const n=Array.isArray(cb.content)?cb.content.length:0;const hosts=(Array.isArray(cb.content)?cb.content:[]).slice(0,3).map(x=>{try{return new URL(x.url).hostname.replace(/^www\./,'')}catch{return ''}}).filter(Boolean);em(`Read ${n} web result${n==1?'':'s'}${hosts.length?': '+hosts.join(', '):''}`,'ok')}
    else if(cb.type==='text'&&!st.wrote){st.wrote=1;em('Model started writing the answer','ok')}}
  else if(e.type==='content_block_delta'&&e.delta&&e.delta.type==='input_json_delta'&&st.tool&&e.index===st.tool.i){st.tool.json+=e.delta.partial_json||''}
  else if(e.type==='content_block_stop'&&st.tool&&e.index===st.tool.i){try{const q=JSON.parse(st.tool.json).query;if(q)em('Web search: “'+q+'”','a')}catch{}st.tool=null}}

/* ===== AUTO (reasoning) mode: picks the best mode, tier and evaluator for each reply, ignoring credit cost ===== */
function autoPick(p,att){
  const t=String(p||'').trim(),w=t.split(/\s+/).filter(Boolean).length;let sc=0;
  if(w>40)sc++;if(w>120)sc++;if(t.length>1200)sc++;
  if(/```/.test(t)||/\b(code|function|bug|error|debug|refactor|api|regex|sql|algorithm|script|component)\b/i.test(t))sc++;
  if(/\b(build|create|make|generate|design)\b[\s\S]{0,40}\b(app|website|page|game|dashboard|system|tool|platform)\b/i.test(t))sc+=2;
  if(/\b(why|how come|prove|derive|optimi[sz]e|trade-?offs?|compare|analy[sz]e|evaluate|strategy|plan|architecture|security|audit|reason|diagnose|decide|pros and cons|root cause)\b/i.test(t))sc+=2;
  if(/\b(step[- ]by[- ]step|in depth|deep dive|thorough|detailed|comprehensive|carefully|complex|hard)\b/i.test(t))sc+=2;
  if((t.match(/\?/g)||[]).length>1||/\b\d\.\s|\band then\b|\bfirst\b[\s\S]{0,80}\bthen\b/i.test(t))sc++;
  if(att&&att.length)sc++;

      $('#chat').scrollTop=1e9};
    const r=await runLoop(c,text,onText,onStep);clearInterval(tick);const dur=Date.now()-t0;
    c.msgs.push({role:'assistant',content:r.text,t:r.t,pid:S.pid,mesh:r.mesh,ui:r.ui,ts:Date.now(),dur});
    c.cost=(c.cost||0)+r.t.cost;c.calls=(c.calls||0)+r.t.calls;S.ledger[today()]=daySpend()+r.t.cost;trackUsage(r.t);if(V.auto&&!r.t.blocked)speak(r.text);

.x, a.y, a.size, a.size);\n  }\n\n  if (gameOver) {\n    ctx.fillStyle = \"rgba(0,0,0,0.7)\";\n    ctx.fillRect(0, 0, canvas.width, canvas.height);\n    ctx.fillStyle = \"#ffffff\";\n    ctx.font = \"20px monospace\";\n    ctx.textAlign = \"center\";\n    ctx.fillText(\"COLLISION DETECTED\", canvas.width / 2, canvas.height / 2);\n  }\n}\n\nfunction loop() {\n  update();\n  draw();\n  requestAnimationFrame(loop);\n}\n\nloop();"}]}];

const TYP={MICRO:{i:260,o:120},STANDARD:{i:520,o:450},DEEP:{i:900,o:2600}};
function modeEst(mode,ev){
  const M=MODES[mode],sc=mode==='eco'?0.85:mode==='thorough'?1.3:1,r={};
  for(const t of ['MICRO','STANDARD','DEEP']){
    const b=TYP[t],base=cost(b.i,b.o*sc);
    const rf=t==='DEEP'?cost(b.i+700,b.o*0.5):cost(b.i,b.o*0.7);
    const judge=ev&&t==='DEEP'?cost(900,40):0;
    r[t]={typ:(base+judge)/CR,max:(base+judge+rf*(M.refines+(judge?1:0)))/CR};
  }
  return r;
}
function measured(mode){
  const by={};S.chats.forEach(c=>c.msgs.forEach(m=>{if(m.t&&m.t.mode===mode&&m.t.calls){(by[m.t.tier]=by[m.t.tier]||[]).push(m.t.cost/CR)}}));

  return `est. per reply · ${S.mode.toUpperCase()}${S.verify==='llm'?' + EVAL':''}: `+['MICRO','STANDARD','DEEP'].map(t=>`${t} ${f1(m[t]??e[t].typ)}${m[t]!=null?'*':''} cr`).join(' · ')+` (DEEP up to ${f1(e.DEEP.max)})`+(Object.keys(m).length?'  * measured':'')}

function parsePatch(t){const re=/<<<<<<< SEARCH\n([\s\S]*?)\n?=======\n([\s\S]*?)\n?>>>>>>> REPLACE/g,o=[];let m;while((m=re.exec(t)))o.push([m[1],m[2]]);return o}

    const L=out.split('\n'),sl=sx.split('\n').map(l=>l.trimEnd());let hit=-1;for(let a=0;a+sl.length<=L.length;a++){let g=true;for(let b=0;b<sl.length;b++)if(L[a+b].trimEnd()!==sl[b]){g=false;break}if(g){hit=a;break}}

/* ============ activity timeline + progress panel ============ */
function stepDetail(x){
  if(/^Reading your message/.test(x))return 'The request is read locally first. Nothing is sent to the model yet.';
  if(/^Context:/.test(x))return 'Only the most recent messages and your pinned notes are sent, which keeps the request small and cheap.';
  if(/^Sending to the model|pass · sending/.test(x))return 'The prompt is sent to the model. The size shown is an estimate of the tokens in the request.';
  if(/^Web search:|^Searching the web/.test(x))return 'The model decided it needs current information and ran a live web search. Each search is billed at about 7 credits.';
  if(/^Read \d+ web/.test(x))return 'The model read the search results and will use them in its answer.';
  if(/^Model started/.test(x))return 'The model began streaming the answer.';
  if(/^Credits:/.test(x))return 'Estimated credit use for this reply. Your exact balance is shown at the top right.';
  if(/^Live web search is ON/.test(x))return 'WEB is switched on, so the model is allowed to search the internet. You pay about 7 credits for each search it runs.';
  if(/^Router →/.test(x))return 'A local classifier chose the tier, output cap, effort level and how much history to send. No model call — 0 credits.';
  if(/^(Context trimmed|ctx:)/.test(x))return 'Older messages were replaced by a short digest and large code blocks by one-line stubs, so fewer tokens are sent.';
  if(/^(Prompt diet|sys:)/.test(x))return 'The persona prompt was distilled to its core before sending.';
  if(/^Cache miss/.test(x))return 'No identical answer was saved, so the model has to be called.';
  if(/^Response cache hit/.test(x))return 'An identical request was answered earlier — served instantly for 0 credits.';
  if(/^gen:/.test(x))return 'The model wrote the first draft ('+x.replace('gen:','').trim()+').';
  if(/^cont#/.test(x))return 'The answer was cut off, so only the missing tail was generated and appended — the earlier text is untouched.';
  if(/^refine/.test(x))return 'A check failed, so the model rewrote the answer once with the specific problem in mind.';
  if(/^Check failed|^Verify failed/.test(x))return 'A free local check found a problem. The loop repairs only what is wrong.';
  if(/^(Checks passed|Local verification passed)/.test(x))return 'Code fences, HTML tags and scripts are closed, JSON parses, and length limits are met — checked locally for 0 credits.';
  if(/^Connectors attached/.test(x))return 'Your enabled connectors were offered to the model as tools for this reply.';
  if(/^🔌 Used/.test(x))return 'These connector tools were called while answering.';
  if(/^(Loop stop|Stop)/.test(x))return 'The loop finished: it stops when checks pass, nothing changed, the repair cap is reached or the budget is used.';
  if(/^Reading /.test(x))return 'The current file is sent to the model so edits line up with your code.';
  if(/^Minimal-edit/.test(x))return 'Only the lines that must change are touched; the rest of the file stays byte-for-byte the same.';
  if(/^Applied \d/.test(x))return 'The edit blocks matched your file and were applied. The previous version is saved in History (Undo is available).';
  if(/^Previous version saved/.test(x)||/^Snapshot saved/.test(x))return 'Every AI change keeps the old version so you can compare or restore it.';
  return ''}
function friendly(x){x=String(x||'');
  if(/^Searching the web|^Web search/.test(x))return 'Searching the web';if(/^Read \d+ web/.test(x))return 'Reading web results';if(/^Sending to the model|pass · sending/.test(x))return 'Sending to the model';if(/^Model started/.test(x))return 'Writing the answer';if(/^Context:/.test(x))return 'Preparing context';if(/^Credits:/.test(x))return 'Finishing up';
  if(/^Router|^Planning/.test(x))return 'Planning the answer';if(/^gen:|^Writing|^Receiving/.test(x))return x.startsWith('Writing')||x.startsWith('Receiving')?x:'Writing';
  if(/^cont#/.test(x))return 'Continuing where it stopped';if(/^refine/.test(x))return 'Refining the result';if(/^(Verify|Check)/.test(x))return 'Checking the result';
  if(/^Cache/.test(x))return 'Looking for a saved answer';if(/^Connectors/.test(x))return 'Connecting tools';if(/^Reading/.test(x))return 'Reading your file';if(/^Applied|^Preview/.test(x))return 'Applying changes';return x.slice(0,40)}

  const cnt=store.get('aix3_cnt',{});out.tools=Object.keys(cnt).filter(k=>k.startsWith('tool.')).map(k=>k.slice(5)+' ×'+cnt[k]);
  out.notes=(c?.notes)||[];out.calls=c?.calls||0;out.cost=(c?.cost||0);out.hist=(proj().history||[]).length;
  let chatHtml=null;if(c)c.msgs.forEach(m=>{if(m.role==='assistant'&&!m.err){const h=extractHtml(m.content);if(h)chatHtml=h}});out.chatHtml=chatHtml;return out}

const IC=(d,extra='')=>`<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}${extra}</svg>`;
const ICONS={copy:IC('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>'),edit:IC('<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'),add:IC('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>'),regen:IC('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>'),speak:IC('<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 9a4 4 0 0 1 0 6"/>'),share:IC('<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>'),trash:IC('<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/>')};
function mtools(i,role,scope){const b=(a,t,ic)=>`<button data-mt="${a}" data-i="${i}" data-sc="${scope||'chat'}" title="${t}" aria-label="${t}">${ic}</button>`;
  return `<div class="mtools">${b('copy','Copy',ICONS.copy)}${role==='user'?b('edit','Edit and resend',ICONS.edit):b('add','Add to chat — quote and type more',ICONS.add)}${role==='assistant'&&scope!=='studio'?b('regen','Regenerate',ICONS.regen)+b('speak','Read aloud',ICONS.speak):''}${b('share','Share',ICONS.share)}${b('del','Remove',ICONS.trash)}</div>`}
const stripAtt=t=>t.replace(/\n*\[Attached file: ([^\]]+)\]\n```[\s\S]*?```/g,'').trim();
function mtAction(a,i,sc){const studio=sc==='studio';const list=studio?proj().chat:(curChat()||{msgs:[]}).msgs;const m=list[i];if(!m)return;const inp=studio?$('#stq'):$('#q');
  if(a==='copy')return navigator.clipboard?.writeText(m.content).then(()=>toast('Copied'),()=>toast('Select & copy manually'));
  if(a==='speak')return speak(m.content);
  if(a==='edit'){if(studio)S.stEdit=i;else{S.editIdx=i;$('#editban').style.display='flex'}inp.value=stripAtt(m.content);inp.focus();inp.dispatchEvent(new Event('input'));if(!studio)toast('Editing — sending replaces this message and the replies after it');return}
  if(a==='add'){const q=m.content.replace(/```[\s\S]*?```/g,'[code]').trim().split('\n').filter(Boolean).slice(0,4).join('\n').slice(0,400).split('\n').map(l=>'> '+l).join('\n');inp.value=(inp.value?inp.value+'\n\n':'')+q+'\n\n';inp.focus();inp.dispatchEvent(new Event('input'));inp.setSelectionRange(inp.value.length,inp.value.length);return}
  if(a==='regen'){let j=i-1;while(j>=0&&list[j].role!=='user')j--;if(j>=0){const q=list[j].content;list.splice(j);save();send(q,{nocache:true})}return}
  if(a==='share')return shareMsg(i,sc);
  if(a==='del'){const n=(m.role==='user'&&list[i+1]&&list[i+1].role==='assistant')?2:1;const removed=list.splice(i,n);if(studio){projSave();renderStChat()}else{save();renderMsgs()}
    toastBtn('Message removed','Undo',()=>{list.splice(i,0,...removed);if(studio){projSave();renderStChat()}else{save();renderMsgs()}})}}
function shareMsg(i,sc){const studio=sc==='studio',list=studio?proj().chat:curChat().msgs,m=list[i];if(!m)return;
  const prev=m.role==='assistant'&&list[i-1]&&list[i-1].role==='user'?list[i-1]:null,label=r=>r==='user'?'Operator':'AIX';
  const mdOne=`**${label(m.role)}:**\n\n${stripAtt(m.content)}\n`,mdPair=(prev?`**${label(prev.role)}:**\n\n${stripAtt(prev.content)}\n\n`:'')+mdOne,mdAll=list.filter(x=>x.role==='user'||x.role==='assistant').map(x=>`**${label(x.role)}:**\n\n${stripAtt(x.content)}\n`).join('\n');
  const d=dialog(`<h3 style="margin:0 0 8px">Share</h3><div class="grid2" style="grid-template-columns:1fr 1fr;gap:8px"><button class="btn2" data-sh="msg">Copy this message</button><button class="btn2" data-sh="pair">Copy question and answer</button><button class="btn2" data-sh="all">Copy whole conversation</button><button class="btn2" data-sh="file">Download as Markdown</button>${MCPC?'<button class="btn" data-sh="doc" style="grid-column:1/3">Save to a new Claude Doc</button>':''}</div><div style="text-align:right;margin-top:10px"><button class="btn2" data-close>Close</button></div>`);
  d.onclick=async e=>{const t=e.target.closest('[data-sh]');if(!t)return;const k=t.dataset.sh,cp=txt=>navigator.clipboard?.writeText(txt).then(()=>{toast('Copied');d.close()},()=>toast('Select & copy manually'));
    if(k==='msg')cp(stripAtt(m.content));else if(k==='pair')cp(mdPair);else if(k==='all')cp(mdAll);else if(k==='file'){saveFile('aix-share.md',mdPair,'text/markdown');d.close()}
    else if(k==='doc'){try{const nm=(stripAtt(prev?prev.content:m.content).split('\n')[0]||'AIX conversation').slice(0,80).replace(/[\u0000-\u001f]/g,' ');await MCPC.callTool('Claude Docs','batch',{container:{kind:'project',create:{name:nm,doc:{markdown:mdPair.slice(0,30000)}}},batch:[]});toast('Document created');d.close()}catch(er){toast(await connectorErr(er))}}}}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-mt]');if(b){e.stopPropagation();mtAction(b.dataset.mt,+b.dataset.i,b.dataset.sc)}},true);

$('#bnav').innerHTML=['chat','studio','tools'].map(k=>{const v=VIEWS.find(x=>x[0]===k);return `<button data-v="${k}" class="${k==='chat'?'on':''}"><span>${ico(k)}</span>${v[1]}</button>`}).join('')+`<button id="bmore"><span>${ico('more')}</span>More</button>`;
$('#bnav').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='bmore'){const cur=(document.querySelector('.view.on')||{id:'vchat'}).id.slice(1);const d=dialog(`<h3 style="margin:0 0 12px">Menu</h3><div class="mgrid">${VIEWS.map(([k,l])=>`<button class="mtile${k===cur?' on':''}" data-mv="${k}"><span class="mti">${ico(k)}</span><span class="mtl">${l}</span></button>`).join('')}</div><div style="text-align:right;margin-top:12px"><button class="btn2" data-close>Close</button></div>`);d.querySelectorAll('[data-mv]').forEach(x=>x.onclick=()=>{d.close();setView(x.dataset.mv)})}else setView(b.dataset.v)};

/* ============ shared database: users & platform totals ============ */
let DB=null,USR=null,ME=null,ADMIN=false,ROWS=[],wq=Promise.resolve();
let MY=store.get('aix3_my',{tokens:0,inTok:0,outTok:0,credits:0,replies:0,calls:0,free:0,cacheHits:0,first:0,last:0});
function trackUsage(t){MY.tokens+=t.inTok+t.outTok;MY.inTok+=t.inTok;MY.outTok+=t.outTok;MY.credits+=t.cost/CR;MY.replies++;MY.calls+=t.calls;if(!t.calls)MY.free++;if(t.cacheHit)MY.cacheHits++;MY.last=Date.now();MY.first=MY.first||MY.last;store.set('aix3_my',MY);
  if(DB&&ME){const snap={...MY};wq=wq.then(()=>DB.doc('usage/'+ME).set(snap)).catch(()=>{})}}
async function initDb(){try{DB=await claude.use('db');USR=await claude.use('user')}catch{}
  if(!DB||!USR){DB=null;return}
  try{ME=await USR.id()}catch{}if(!ME){DB=null;return}
  try{ADMIN=!!(await USR.canEdit())}catch{}
  try{const d=await DB.doc('usage/'+ME).get();if(d.exists){const r=d.data();if((r.tokens||0)>MY.tokens)MY={...MY,...r}}}catch{}
  const timer=setTimeout(()=>{ROWS=ROWS||[]},10000);
  DB.collection('usage').onSnapshot(sn=>{clearTimeout(timer);ROWS=sn.docs.map(d=>({id:d.id,...d.data()}));if($('#vusers').classList.contains('on'))renderUsers()},()=>{});
  try{DB.doc('members/'+ME).onSnapshot(sn=>{MEMBER=sn.exists?sn.data():{granted:0};if($('#vmembers').classList.contains('on'))renderMembers()},()=>{})}catch{}
  try{DB.doc('config/stripe').onSnapshot(sn=>{STRIPE=sn.exists?sn.data():{links:{}};if($('#vmembers').classList.contains('on'))renderMembers()},()=>{})}catch{}
  setStatus()}
async function renderUsers(){
  const box=$('#usersbody');
  if(!DB){box.innerHTML=`<div class="tool"><h4 class="mono">YOUR USAGE (this browser)</h4><p>The shared database is unavailable in this view (sign in to the artifact). Showing local totals only.</p>${cardsHtml([['REPLIES',MY.replies],['TOKENS (est.)',MY.tokens],['CREDITS USED',MY.credits.toFixed(2)],['FREE REPLIES',MY.free]])}</div>`;return}
  const rows=(ROWS.length?ROWS:[{id:ME,...MY}]);const tot=rows.reduce((a,r)=>({t:a.t+(r.tokens||0),c:a.c+(r.credits||0),r:a.r+(r.replies||0),f:a.f+(r.free||0),k:a.k+(r.calls||0)}),{t:0,c:0,r:0,f:0,k:0});
  let names={};try{names=await USR.profiles(rows.map(r=>r.id))}catch{}
  const nm=r=>(names[r.id]&&names[r.id].name)||(r.id===ME?'You':'User '+String(r.id).slice(0,5));
  rows.sort((a,b)=>(b.tokens||0)-(a.tokens||0));
  box.innerHTML=`<div class="cards mono">${[['USERS',rows.length],['PLATFORM TOKENS',tot.t.toLocaleString()],['CREDITS USED',tot.c.toFixed(2)],['REPLIES',tot.r],['MODEL CALLS',tot.k],['FREE REPLIES',tot.f]].map(([a,b])=>`<div class="card"><small>${a}</small><div>${b}</div></div>`).join('')}</div>
  <div class="pn"><h4 class="mono">${ADMIN?'ALL USERS':'YOUR USAGE'} · 1 credit = a fixed slice of spend · tokens are estimates</h4><table class="t mono"><tr><th>USER</th><th>REPLIES</th><th>CALLS</th><th>TOKENS</th><th>CREDITS</th><th>LAST ACTIVE</th></tr>
  ${rows.map(r=>`<tr><td>${esc(nm(r))}</td><td>${r.replies||0}</td><td>${r.calls||0}</td><td>${(r.tokens||0).toLocaleString()}</td><td>${(r.credits||0).toFixed(2)}</td><td>${r.last?new Date(r.last).toLocaleString():'—'}</td></tr>`).join('')}</table></div>
  <div style="display:flex;gap:8px"><button class="btn" id="umd">⬇ Export users.md</button><button class="btn2" id="ujs">⬇ Export JSON</button></div>
  ${ADMIN?'':'<p class="mono" style="font-size:11px;color:var(--m)">Platform-wide totals and all users are visible to the owner and editors; you see your own row.</p>'}`;
  $('#umd').onclick=()=>saveFile('users.md',`# AIX ALPHA — Platform usage\n\nGenerated: ${new Date().toISOString()}\n\n| User | Replies | Model calls | Free replies | Tokens (est.) | Credits |\n|---|---:|---:|---:|---:|---:|\n`+rows.map(r=>`| ${nm(r).replace(/\|/g,'')} | ${r.replies||0} | ${r.calls||0} | ${r.free||0} | ${r.tokens||0} | ${(r.credits||0).toFixed(2)} |`).join('\n')+`\n\n**Totals:** ${rows.length} users · ${tot.t} tokens · ${tot.c.toFixed(2)} credits · ${tot.r} replies\n`,'text/markdown');
  $('#ujs').onclick=()=>saveFile('users.json',JSON.stringify(rows,null,1),'application/json')}
const cardsHtml=a=>`<div class="cards mono">${a.map(([x,y])=>`<div class="card"><small>${x}</small><div>${y}</div></div>`).join('')}</div>`;

$('#menu').innerHTML=ico('menu');$('#att').innerHTML=ico('attach');$('#mic').innerHTML=ico('mic');$('#estb').innerHTML=ico('coins')+'<span class="lbl"> credits</span>';document.querySelector('#progb .pi').innerHTML=ico('pulse');
buildPersonaSel();setStatus();if(S.chats.length)S.cur=S.chats[0].id;renderThreads();renderMsgs();
(async()=>{try{sampleFn=await claude.use('sample')}catch{sampleFn=null}
  if(!sampleFn&&!BACKEND()){try{const mr=await fetch('master.json',{cache:'no-store'});if(mr.ok){const mj=await mr.json();if(mj&&/^https?:\/\//.test(mj.url||''))store.set(BEK,String(mj.url).replace(/\/+$/,''))}}catch{}}
  try{const hm=location.hash.match(/[#&]t=(aix_[a-f0-9]+)/);if(hm){store.set(TOKK,hm[1]);history.replaceState(null,'',location.pathname+location.search)}}catch{}
  if(!sampleFn)sampleFn=pickEngine();
  if(BACKEND()&&store.get(TOKK,'')){try{const mr=await fetch(BACKEND()+'/api/account/me',{headers:{authorization:'Bearer '+store.get(TOKK,'')}});if(mr.ok){const mj=await mr.json();BAL=mj.credits;UNAME=mj.username||'';EMAIL=mj.email||'';store.set('aix3_email',EMAIL);ISOWNER=!!mj.owner;store.set('aix3_owner',ISOWNER);FREE=!!mj.free_claimed;store.set('aix3_free',FREE);store.set('aix3_user',UNAME)}else if(mr.status===401){store.set(TOKK,'');sampleFn=null}}catch{}}
  setStatus();if(!sampleFn&&BACKEND()&&!store.get(TOKK,'')&&!embKey()){setTimeout(()=>{try{openAccount(true)}catch{}},400)}
  if(!sampleFn){const pm=$('#pm');pm.style.cursor='pointer';pm.onclick=()=>openKey()}initDb();loadLive().then(()=>{try{rerenderConnCards()}catch{}})})();
</script>
